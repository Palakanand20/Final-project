[project]
name = "wiki-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "rich",
    "httpx",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["server", "client", "cli", "tui"]
omit = ["*/test_*", "gui/*", "*/conftest*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
